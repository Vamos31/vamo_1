services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_HOST=http://localhost:8000

  backend:
    build: ./backend
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    # 起動時にマイグレーションを最新にしてから API を起動する
    command: sh -c "alembic upgrade head && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/postgres
      - FRONTEND_ORIGIN=http://localhost:3000
      - COOKIE_SECURE=false
      - SESSION_TTL_DAYS=14
      - INVITATION_TTL_DAYS=7
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db-data:
