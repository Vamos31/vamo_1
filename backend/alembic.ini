# 汎用的な、単一データベース向けの設定。

[alembic]
# マイグレーションスクリプトの場所。
# 通常は POSIX 形式 (スラッシュ区切り) で書き、%(here)s (この ini ファイルの
# 場所を指すトークン) からの相対パスにする
script_location = %(here)s/alembic

# マイグレーションのファイル名のテンプレート。既定値は %%(rev)s_%%(slug)s
# ファイル名の先頭に日時を付けたい場合は、下の行のコメントを外す
# 使えるトークンの一覧: https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# または、日付ごとのサブディレクトリに整理する (recursive_version_locations = true が必要)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# sys.path に追加するパス。指定すると sys.path の先頭に追加される。
# 既定はカレントディレクトリ。複数指定する場合の区切り文字は、
# 下の "path_separator" で決める。
prepend_sys_path = .


# マイグレーションファイル内やファイル名に埋め込む日時のタイムゾーン。
# 指定する場合は tzdata ライブラリが必要で、pip の requirements に
# `alembic[tz]` を追加するとインストールできる。
# 値は ZoneInfo() に渡される。
# 空欄にするとローカル時刻になる
# timezone =

# "slug" (ファイル名に入る説明文) の最大文字数
# truncate_slug_length = 40

# 'true' にすると、'revision' コマンドの実行時に、autogenerate の有無に
# かかわらず env を実行する
# revision_environment = false

# 'true' にすると、versions/ ディレクトリ内で、元の .py ファイルがない
# .pyc / .pyo ファイルもリビジョンとして検出する
# sourceless = false

# マイグレーションの置き場所の指定。既定は <script_location>/versions。
# 複数のディレクトリを使う場合、最初のリビジョンは --version-path で
# 指定する必要がある。
# 区切り文字は、下の "path_separator" で指定したものを使う。
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator: パスのリスト (version_locations や prepend_sys_path など、
# alembic.ini のような configparser 形式のファイルに書くもの) を区切る
# 文字を指定する。
# 新しい alembic.ini の既定値は "os" で、os.pathsep を使って
# OS ごとの区切り文字で分割する。
#
# 古い alembic.ini との互換性のため、path_separator が書かれていない
# 場合は、この既定値は適用されない。このオプションを完全に省略した
# 場合の動作は次のとおり。
#
# 1. version_locations は、従来の "version_path_separator" キーで解釈する。
#    それもなければ、従来どおり空白やカンマで分割する。
# 2. prepend_sys_path は、従来どおり空白、カンマ、コロンで分割する。
#
# path_separator に指定できる値:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# os.pathsep を使う。新しいプロジェクトの既定の設定。
path_separator = os

# 'true' にすると、各 "version_locations" ディレクトリ内の
# ソースファイルを再帰的に検索する
# Alembic 1.10 で追加
# recursive_version_locations = false

# script.py.mako からリビジョンファイルを書き出すときの
# 出力エンコーディング
# output_encoding = utf-8

# データベースの URL。ユーザーが管理する env.py スクリプトだけが
# これを使う。DB の URL は、env.py の中で別の方法で設定してもよい。
# (このプロジェクトでは env.py で settings.database_url から設定するので、
#  下の値は実際には使われない)
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks は、新しく生成したリビジョンスクリプトに対して
# 実行するスクリプトや Python 関数を定義する。詳しい説明や例は
# ドキュメントを参照

# "black" で整形する - console_scripts ランナーを使い、"black" エントリポイントを呼ぶ
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# "ruff" で lint して自動修正を試みる - module ランナーを使い、"ruff" モジュールを呼ぶ
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# または、exec ランナーで、PATH 上にあるバイナリを実行する
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# ログの設定。これも、ユーザーが管理する env.py スクリプトだけが
# 使う。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
